<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Webhatrix Technologies</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="error-page">
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <section class="section" style="height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;">
        <div class="hero-glow hero-glow--cyan" style="top: 30%; left: 30%;"></div>
        <div class="hero-glow hero-glow--violet" style="bottom: 30%; right: 30%;"></div>
        
        <div class="container">
            <h1 class="section-title" style="font-size: 8rem; margin-bottom: 0;">404</h1>
            <h2 style="font-size: 2rem; color: var(--text); margin-bottom: 1.5rem;">Oops! Lost in Digital Space?</h2>
            <p style="color: var(--muted); max-width: 500px; margin: 0 auto 2.5rem; font-size: 1.1rem;">
                The page you are looking for might have been moved, deleted, or never existed in the first place.
            </p>
            <div class="hero-buttons" style="justify-content: center;">
                <a href="index.html" class="btn btn-primary"><span>Back to Home</span></a>
                <a href="work.html" class="btn btn-ghost"><span>View Portfolio</span></a>
            </div>
        </div>
    </section>

    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
